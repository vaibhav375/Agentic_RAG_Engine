[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-engine"
version = "0.1.0"
description = "Self-correcting agentic RAG engine with an automated evaluation harness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vaibhav" }]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "tenacity>=8.2",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# Heavy ML backends — only needed for `local`/`api` mode, not for tests/CI.
local = [
    "sentence-transformers>=2.7",
    "torch>=2.2",
    "faiss-cpu>=1.8",
    "transformers>=4.40",
]
api = [
    "openai>=1.30",
    "anthropic>=0.25",
]
store = [
    "qdrant-client>=1.9",
    "redis>=5.0",
]
viz = [
    "matplotlib>=3.8",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
arag = "arag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042 (StrEnum) requires 3.11; we keep 3.10 compatibility.
ignore = ["E501", "UP042"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
