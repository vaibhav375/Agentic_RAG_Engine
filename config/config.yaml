# =============================================================================
# Agentic RAG Engine — central configuration
# Every tunable lives here. Nothing about models / k-values / thresholds should
# be hard-coded in the source. Override any field via env var ARAG_<PATH>, e.g.
#   ARAG_LLM__PROVIDER=openai  ARAG_RETRIEVAL__K_DENSE=20
# =============================================================================

# ----- Provider mode -------------------------------------------------------
# "mock"  -> fully deterministic, no network, no API keys (used by tests/CI/demo)
# "local" -> sentence-transformers embeddings + cross-encoder rerank + Ollama LLM
# "api"   -> API embeddings/LLM (OpenAI or Anthropic)
# The three components (embeddings, reranker, llm, nli) can each be pointed at a
# different backend; `mode` just sets sensible defaults below.
mode: mock

# Directory of raw source documents to ingest.
corpus_dir: data/corpus

# ----- Embeddings ----------------------------------------------------------
embeddings:
  provider: mock                 # mock | sentence_transformers | openai
  model: BAAI/bge-small-en-v1.5  # used when provider=sentence_transformers
  openai_model: text-embedding-3-small
  dim: 384                       # mock/st dimension; openai-3-small = 1536
  batch_size: 64
  normalize: true

# ----- LLM (generation + critic + reformulation) ---------------------------
llm:
  provider: mock                 # mock | openai | anthropic | ollama
  model: gpt-4o-mini             # openai (also: the model id for any OpenAI-
                                 # compatible host configured via base_url)
  anthropic_model: claude-3-5-sonnet-latest
  ollama_model: qwen3:4b         # open-weight, runs locally, no key
  # `provider: openai` speaks to any OpenAI-compatible endpoint. Leave base_url
  # empty for OpenAI itself; set it to reach open-weight models too large to run
  # locally (Kimi K2 is ~1T params MoE — open weights, but not laptop-sized):
  #   Moonshot (Kimi):  base_url https://api.moonshot.ai/v1        model kimi-k2-0711-preview
  #   OpenRouter:       base_url https://openrouter.ai/api/v1      model moonshotai/kimi-k2
  #   Together:         base_url https://api.together.xyz/v1       model Qwen/Qwen3-235B-A22B
  #   local vLLM:       base_url http://localhost:8000/v1          (api_key_env unused)
  base_url: ""
  api_key_env: OPENAI_API_KEY    # which env var holds the key for base_url
  temperature: 0.0
  max_tokens: 1024              # Ollama: sent as num_predict. Uncapped local
                                # models run past any timeout.
  timeout_seconds: 300          # local models are slow; the loop makes many calls
  # Reasoning models (qwen3, deepseek-r1) narrate before answering, which lands
  # in the answer text and wrecks citation parsing and token-F1. null = don't
  # send the field (Ollama < 0.9 rejects it); false = ask for no thinking.
  think: false
  # Separate models for the critic and the router. Falls back to the generation
  # model when null. Set the model id in the form your provider expects (an
  # Ollama tag for provider: ollama, an API model id otherwise).
  #
  # A *stronger* judge than generator is the highest-leverage local-mode knob:
  # with a 3B model judging its own output the critic mis-scored correct answers,
  # producing 31% "hallucination" and 33% over-abstention that were both judge
  # error, not fabrication (docs/local-mode-eval.md). A different judge also
  # reduces LLM-as-judge self-preference bias.
  #   e.g. with provider: ollama -> judge_model: qwen2.5:7b
  judge_model: null
  # The router only classifies query complexity, so it can be smaller/cheaper.
  router_model: null

# ----- Chunking (first-class ablation variable) ----------------------------
chunking:
  strategy: recursive            # recursive | sentence | fixed
  chunk_size: 512                # tokens (approx, whitespace-token proxy)
  chunk_overlap: 64
  pack_blocks: true              # merge consecutive short blocks (same section)
                                 # up to chunk_size. false = one chunk per
                                 # paragraph, which ignores chunk_size entirely
  contextual_enrichment: false   # Anthropic-style: prepend LLM-written context
                                 # to each chunk before embedding (ablation knob)

# ----- Retrieval -----------------------------------------------------------
retrieval:
  k_dense: 10
  k_sparse: 10
  rrf_k: 60                      # Reciprocal Rank Fusion constant
  use_hybrid: false              # Phase 3 turns this on
  use_rerank: false              # Phase 3 turns this on
  use_hyde: false                # HyDE: embed a hypothetical answer for dense search
  use_decompose: false           # split multi-hop queries into sub-questions + fuse
  use_mmr: false                 # Maximal Marginal Relevance: diversify final contexts
  mmr_lambda: 0.7                # MMR relevance/diversity tradeoff (1.0 = pure relevance)
  rerank_model: BAAI/bge-reranker-base
  # How the reranker's order combines with the retrieval order it was handed.
  # "replace" trusts the reranker completely; "rrf" fuses the two rankings so a
  # reranker weaker than the retriever can nudge but not overturn.
  # Measured (mock, this corpus, full pipeline):
  #   replace -> recall@1 0.833, hallucination 0.000, correct abstention 1.000
  #   rrf     -> recall@1 0.917, hallucination 0.032, correct abstention 0.750
  # rrf ranks better but shifts which passages reach the generator, and the CRAG
  # gate's thresholds are calibrated against the context set it was tuned on —
  # `make sweep NAME=crag` could only recover to 0.016/0.875. Ranking quality is
  # not worth the headline safety metric, so `replace` stays the default. Revisit
  # with a real cross-encoder, where the reranker actually adds information.
  rerank_fusion: replace         # rrf | replace
  rerank_top_n: 5                # context passages fed to the generator
  fetch_k: 20                    # candidates pulled before fusion/rerank

# ----- Vector store --------------------------------------------------------
vector_store:
  # Exact brute-force cosine over normalized vectors — no ANN index. A `backend`
  # key used to sit here offering faiss|qdrant; neither was implemented and the
  # key was never read, so it has been removed rather than left to mislead.
  # Retrieval is ~4% of query latency at this corpus size, so an ANN index would
  # buy nothing yet.
  persist_dir: .arag_index       # where vectors/BM25/meta are persisted

# ----- Agentic self-correction loop ----------------------------------------
agent:
  enabled: false                 # Phase 4 turns this on
  max_iterations: 2              # hard cap to protect latency/cost
  critic: llm                    # llm | nli | both  (both = LLM judge + NLI cross-check)
  # How the critic splits an answer into claims.
  #   llm    -> ask the model (an extra generation call per loop iteration)
  #   clause -> the deterministic clause splitter the eval metric already uses
  # `clause` is the default because it is better on BOTH axes, which is rare.
  # Measured, qwen2.5:7b, 40-question subset, one variable changed:
  #   hallucination   0.075 -> 0.000     faithfulness 0.875 -> 0.946
  #   p50 latency     65.4s -> 42.6s     query time   56.8min -> 34.3min
  # Small costs: citation precision 0.938 -> 0.922, answer correctness
  # 0.403 -> 0.367. Mock also improves (0.018 -> 0.009).
  # Why it is faster: the stage profile was generate 56% / critique 38%, and
  # most of that critique cost was this extraction call, not the NLI scoring.
  # Why it is *more accurate*: the deterministic split produces claims that
  # track the answer's own sentences, so the online critic's judgments line up
  # with how faithfulness is measured offline instead of drifting with whatever
  # the model chose to paraphrase.
  claim_extraction: clause       # llm | clause
  nli_model: cross-encoder/nli-deberta-v3-base
  # Pairs per NLI forward pass. The critic scores claims x premise units, so a
  # long answer over ten chunks is several hundred pairs; deberta's disentangled
  # attention allocates ~batch x heads x seq^2, and this exhausted MPS mid-run
  # once (Ollama holds ~3.4 GiB of the same unified memory).
  # Left at the library default because the backend halves itself on an
  # allocation failure and keeps the reduced size: paying for that once, when it
  # happens, beats a permanent tax. Measured 29.1 ms/pair here against 38.9 at
  # batch 8 — capping pre-emptively cost 33% throughput to avoid one retry.
  # Score-neutral either way: batching is bit-identical to 1.4e-5.
  nli_batch_size: 32
  support_threshold: 0.5         # min fraction of claims that must be supported
  # NLI entailment probability above which a claim counts as supported.
  # MEASURED INERT on this NLI model: a 9-point sweep at 0.3 / 0.5 / 0.7 gave
  # byte-identical results at every support level, because deberta's scores
  # saturate near 0 and 1 and nothing lands in the band this threshold moves
  # through. Kept because a different NLI model may well spread its scores.
  nli_entail_threshold: 0.5
  abstain_message: "I don't have enough information in the provided sources to answer this confidently."
  # Corrective-RAG (CRAG) answerability gate: grade whether retrieved context can
  # actually answer the query before generating; decline when it can't. This is
  # the main lever for eliminating out-of-scope hallucination.
  crag:
    enabled: false               # Phase 4 (extra) turns this on
    # NOTE: a `mode: heuristic | llm` key used to live here. `grade_retrieval`
    # never read it, so `llm` silently did nothing. It is removed rather than
    # implemented because an LLM answerability grader measured *worse* than the
    # heuristic on this corpus (3/4 vs 4/4, docs/local-mode-eval.md).
    correct_threshold: 0.55      # IDF-weighted query coverage >= -> answerable
    # < -> out of scope, abstain before generating.
    #
    # This threshold is MODE-DEPENDENT, and that is a measured fact rather than a
    # convenience. How far the gate can safely be relaxed depends on how strong
    # the critic behind it is, and the critic is a different thing in each mode.
    #
    # Was 0.51 everywhere, tuned against the whole gold set — it declined five
    # in-scope questions, three by less than 0.03 (coverage 0.497, 0.483, 0.441
    # against a 0.51 cut). Re-chosen on the *dev split alone*, where the largest
    # threshold declining nothing answerable is 0.267; 0.25 takes that with margin.
    #
    # local (real NLI critic), full gold set, 0.51 -> 0.25:
    #   over_abstention   0.1379 -> 0.0805   (all five recovered)
    #   dev / holdout     0.1364 -> 0.0758  |  0.1429 -> 0.0952
    #   hallucination     0.0085 -> 0.0256   (1 -> 3 questions of 117)
    #   adversarial       1.0000 -> 0.9444   (17 of 18)
    #   correct_abstention stays 1.000
    # It improves on the *holdout* too, so it is not another in-sample gain. The
    # safety cost was an explicit trade: ~5 answers recovered for 2 more
    # hallucinations. Affordable only because the gate is not the load-bearing
    # safety mechanism there — with CRAG disabled entirely, correct_abstention
    # still measured 1.000, the post-generation critic refusing the unanswerable
    # on its own.
    #
    # mock (lexical stand-in critic) tells the opposite story, so the same value
    # must NOT be used there:
    #   thresh   correct_abst  adversarial  over_abst  hallucination
    #   0.51           0.9167       0.8889     0.1609         0.0085
    #   0.45           0.8333       0.8333     0.1379         0.0171
    #   0.25           0.6667       0.7222     0.1379         0.0342
    # Every bit of coverage is already recovered by 0.45; below it over_abstention
    # is flat while safety keeps falling — pure loss. Mock leans on this gate
    # because its critic cannot catch what the gate lets through.
    # 0.25 was adopted for local/api and then REVERTED. On dev it looked like a
    # clear win (over_abstention 0.1379 -> 0.0805, all five recovered), but the
    # holdout — which nothing was tuned against — showed the gain was mostly where
    # the threshold had been chosen: out-of-sample it recovered 1 question and
    # cost 1 hallucination, while dropping adversarial robustness 1.000 -> 0.944
    # and tripling hallucination overall (0.0085 -> 0.0256).
    #
    # 0.51 with the packed chunker is the best configuration measured on this
    # project: hallucination 0.0085, adversarial 1.000, correct_abstention 1.000,
    # recall@1 0.9598, MRR 0.9943 — and over_abstention 0.1379, still better than
    # the 0.1609 it was before the chunker fix.
    #
    # Anyone lowering this should know it is mode-sensitive: how far the gate can
    # relax depends on the critic behind it. In local the NLI critic refuses the
    # unanswerable on its own (correct_abstention stayed 1.000 with CRAG fully
    # off); in mock the lexical stand-in cannot, and 0.25 there costs
    # correct_abstention 0.917 -> 0.667 for no coverage gain at all. Untested
    # middle ground: 0.45 would recover the two highest-scoring of the five
    # (0.497, 0.483) — see eval/experiments/crag_threshold.py.
    incorrect_threshold: 0.51
  # Query router: send trivially-simple queries straight to generation and only
  # complex ones through the full loop (cost-aware). Classifier is heuristic +
  # optional LLM.
  router:
    enabled: false               # Phase 4 (extra) turns this on
    mode: heuristic              # heuristic | llm
    complex_min_tokens: 12       # queries longer than this are "complex"

# ----- Semantic cache ------------------------------------------------------
cache:
  enabled: false                 # Phase 5 turns this on
  backend: memory                # memory | redis
  redis_url: redis://localhost:6379/0
  similarity_threshold: 0.95     # cosine >= this -> cache hit (conservative)
  ttl_seconds: 3600
  max_entries: 1000

# ----- Serving -------------------------------------------------------------
serve:
  host: 0.0.0.0
  port: 8000

# ----- Evaluation ----------------------------------------------------------
eval:
  gold_path: data/eval/gold_qa.jsonl
  results_dir: eval/results
  # (A `metric_judge_provider` key used to sit here and was never read. The
  # real control is `faithfulness_method` below, plus `llm.judge_model`.)
  subset: null                   # e.g. 20 to run a fast CI subset; null = all
  # Held-out split. Thresholds, prompts and the CRAG gate were all tuned against
  # the full gold set, so those numbers are in-sample. `split: holdout` evaluates
  # only questions nothing was tuned against; the gap between dev and holdout is
  # the overfitting you actually have.
  #   all      -> every question (default; what the published numbers use)
  #   dev      -> the tuning half
  #   holdout  -> the untouched quarter
  split: all                     # all | dev | holdout
  holdout_fraction: 0.25
  split_seed: 20260804           # fixed: a moving split makes runs incomparable
  retrieval_k: 10                # k for recall@k / precision@k on the ranked pool
  # recall@k at a generous k saturates at 1.0 on a small corpus, hiding every
  # ranking change. Also report recall at the k the generator actually reads,
  # where hybrid/rerank/HyDE differences are visible.
  strict_ks: [1, 3]
  calibration_path: data/eval/judge_calibration.jsonl
  # How eval measures faithfulness. Default "nli" decouples the metric from the
  # LLM-as-judge that drives the online loop, so we don't grade the loop with its
  # own grader. Set "llm" or "both" to compare.
  faithfulness_method: nli
  # Semantic answer grading beside token-F1, never instead of it — token-F1 is
  # the historical series every past number sits on. Uses `llm.judge_model` when
  # set, else the generation model; mock falls back to a lexical stand-in that
  # inherits token-F1's flaw and is only a placeholder.
  #
  # Validated on 9 hand-verified labels (eval/experiments/judge_validation.py):
  #   token-F1     ranks them close to backwards (wrong answer scores highest)
  #   qwen2.5:3b   7/9 — never accepts a wrong answer, misses 2 correct ones
  #   qwen2.5:7b   9/9
  # Size matters for this task even though it did not for claim-support flagging,
  # so pointing llm.judge_model at a larger model than the generator is worthwhile.
  # Costs one judge call per answered gold question.
  answer_equivalence: true

  # How an answer is split into claims for the NLI metric. `clause` strips
  # framing conditionals ("If X, Y" -> assert Y) and splits trailing so/because
  # clauses; entailment models score compound conditionals far worse than the
  # clause alone (measured 0.000 vs 0.992). `sentence` keeps whole sentences.
  claim_decomposition: clause     # clause | sentence
  # What counts as a hallucination.
  #   strict   -> any claim not fully entailed by the context (the original rule).
  #               Scores "correct answer + one aside the sources don't mention"
  #               the same as an invented answer.
  #   severity -> the answer contradicts the sources, or its core is ungrounded.
  #               An aside is still reported via unsupported_claim_rate, but it
  #               isn't a hallucination on its own.
  # Both are computed every run (`hallucination` and `hallucination_strict`), so
  # switching modes can't quietly improve the headline number.
  hallucination:
    mode: severity                    # severity | strict
    min_contradicted_fraction: 0.001  # any contradicted claim -> fabrication
    min_support_fraction: 0.5         # below this, the core isn't grounded
  # Threshold grids for `make sweep` (python -m eval.sweep <name>). Each entry is
  # {dotted config key: [values]}; the sweep runs the full pipeline at every
  # combination and reports the best point that doesn't regress safety.
  sweeps:
    abstention:
      agent.support_threshold: [0.3, 0.5, 0.7]
      agent.nli_entail_threshold: [0.3, 0.5, 0.7]
    crag:
      agent.crag.correct_threshold: [0.5, 0.55, 0.6]
      # Spans the old in-sample value and the dev-chosen one, so a re-sweep can
      # see the whole trade rather than three points around the old default.
      agent.crag.incorrect_threshold: [0.20, 0.25, 0.30, 0.40, 0.51]
    cache:
      cache.similarity_threshold: [0.9, 0.95, 0.98]
  # CI regression gate + PR eval-report bot. These are the defaults; the
  # `eval.ci_gate` CLI flags override them.
  ci_gate:
    max_hallucination: 0.15      # absolute budget: fail above this
    min_correct_abstention: 0.5  # absolute budget: fail below this
    tolerance: 0.05              # allowed per-metric regression vs. the baseline
    baseline_path: eval/results/ci_baseline.json
    trend_runs: 8                # runs shown in the PR comment's sparkline trend
