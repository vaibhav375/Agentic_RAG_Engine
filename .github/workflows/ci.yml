name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  # Re-run the gate on demand (e.g. to refresh the badge after a config change).
  workflow_dispatch:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install (mock mode — no API keys needed)
        run: pip install -e ".[dev,viz]"

      - name: Lint
        run: ruff check src eval tests

      - name: Unit + integration tests
        run: pytest -q

      - name: Validate gold set
        run: python -m eval.build_gold_set config/config.yaml

      # The registry's history.jsonl is what the PR comment's trend is drawn
      # from, and runners are ephemeral — so carry it across runs in the cache.
      # (Not an artifact: download-artifact only sees the *current* run.) The
      # run-id key always writes; restore-keys pull the newest prior history,
      # falling back to the default branch's cache for PR runs. Absent on the
      # very first run — the trend degrades gracefully to a one-line note.
      - name: Restore eval history (trend across runs)
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: eval/results/history.jsonl
          key: eval-history-${{ github.run_id }}
          restore-keys: eval-history-

      # Eval-as-regression-gate: run the harness and fail the build if quality
      # regresses past the budget or drifts below the committed baseline. The
      # same structured verdict is rendered as the PR comment body.
      - name: Eval regression gate
        id: gate
        continue-on-error: true
        run: python -m eval.ci_gate --report comment.md --github-output

      - name: Build eval dashboard
        continue-on-error: true
        run: python -m eval.dashboard config/config.yaml

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v5
        with:
          name: eval-dashboard
          path: |
            eval/results/dashboard.html
            eval/results/ci_gate.json
            eval/results/history.jsonl
            comment.md
          if-no-files-found: warn

      # One sticky comment per PR: find it by the hidden marker and edit in
      # place, otherwise create it. Fork PRs get a read-only GITHUB_TOKEN, so
      # this step is best-effort — the gate itself still enforces quality.
      - name: Post eval report comment
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- arag-eval-report -->';
            if (!fs.existsSync('comment.md')) {
              core.warning('No comment.md produced — skipping eval report comment.');
              return;
            }
            const body = fs.readFileSync('comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = existing.find(c => c.body && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # The gate's verdict is the check's verdict (the step above is allowed to
      # fail so the comment still gets posted on a regression).
      - name: Enforce gate verdict
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::Eval regression gate failed — see the Eval Report comment."
          exit 1

  # Badge reflects merged main only, so PRs never touch it.
  badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install (mock mode)
        run: pip install -e ".[dev]"

      - name: Compute badge
        continue-on-error: true
        run: python -m eval.ci_gate --badge eval/results/badge.json

      - name: Commit badge
        run: |
          if git diff --quiet -- eval/results/badge.json eval/results/badge.svg; then
            echo "badge unchanged"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eval/results/badge.json eval/results/badge.svg
          git commit -m "chore: update hallucination badge [skip ci]"
          git push
